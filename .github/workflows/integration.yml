name: Integration build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - app
      - plugins/accessibility-grant
      - plugins/phigros-advisor
      - plugins/gacha-analysis
      - .gitmodules
      - tools/build-all.ps1
      - tools/workspace-status.ps1
      - .github/workflows/integration.yml
  push:
    branches:
      - main
    paths:
      - app
      - plugins/accessibility-grant
      - plugins/phigros-advisor
      - plugins/gacha-analysis
      - .gitmodules
      - tools/build-all.ps1
      - tools/workspace-status.ps1
      - .github/workflows/integration.yml

permissions:
  contents: read

jobs:
  build-verified-combination:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout integration workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3
        with:
          gradle-version: '8.9'

      - name: Verify clean locked workspace
        shell: pwsh
        run: .\tools\workspace-status.ps1 -FailOnDirty

      - name: Build and test locked component combination
        shell: pwsh
        run: .\tools\build-all.ps1

      - name: Upload verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-tool-suite-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
